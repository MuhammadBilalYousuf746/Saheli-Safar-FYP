<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="color-scheme" content="dark" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      /* Static first paint matches src/theme/colors.js before the bundle loads. */
      html, body { height: 100%; margin: 0; background: #17131F; color: #F7F2FA; color-scheme: dark; }
      body { overflow: hidden; }
      #root { display: flex; height: 100%; flex: 1; }
      input { color-scheme: dark; }
      #root :focus-visible:not(input):not(textarea), [role="dialog"] :focus-visible:not(input):not(textarea) { outline: 2px solid #C7A3E4; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run Saheli Safar.</noscript>
    <div id="root"></div>
  </body>
</html>
